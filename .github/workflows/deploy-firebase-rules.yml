name: Deploy Firebase Database Rules

on:
  push:
    branches: [main]
    paths:
      - firebase.rules.json
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firebase-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WEREWOLF_BOARD_GAME_9B361 }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Realtime Database rules
        run: firebase deploy --only database --project werewolf-board-game-9b361 --non-interactive
